<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found | GENZIQ</title>
  <meta name="description" content="The requested page could not be found. Return to GENZIQ homepage.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      --bg: #04060d;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4fd;
      --muted: #9594b5;
      --iris: #6e69f3;
      --glow: #b6b4ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: radial-gradient(circle at 50% 20%, rgba(110, 105, 243, 0.12), transparent 60%);
    }
    .panel {
      max-width: 480px;
      width: 100%;
      text-align: center;
      padding: 3rem 2rem;
      border-radius: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .code {
      font-size: 5.5rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      background: linear-gradient(135deg, #ffffff 30%, var(--glow) 70%, var(--iris) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 {
      margin-top: 1rem;
      font-size: 1.5rem;
      font-weight: 600;
    }
    p {
      margin-top: 0.75rem;
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .actions {
      margin-top: 2rem;
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #7c77f8, #5953e5);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(110, 105, 243, 0.35);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(110, 105, 243, 0.45);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="code">404</div>
    <h1>Lost in Deep Space</h1>
    <p>The coordinate you're seeking doesn't exist or has moved beyond our current orbit.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Return to Orbit</a>
      <a href="/contact" class="btn btn-secondary">Send a Signal</a>
    </div>
  </div>
</body>
</html>
